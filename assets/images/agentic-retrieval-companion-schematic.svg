<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Agentic retrieval companion: game telemetry to SQLite world model, MCP server, provider-agnostic agent loop, voice in and out.">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6775"/></marker></defs>
<rect width="1600" height="900" fill="#f6f1e8"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172033">
<rect x="70" y="120" width="300" height="130" rx="18" fill="#fff" stroke="#d8d1c4" stroke-width="3"/>
<text x="220" y="175" font-size="30" font-weight="700" text-anchor="middle">Game telemetry</text>
<text x="220" y="215" font-size="22" fill="#5d6775" text-anchor="middle">Lua mod, JSONL snapshots</text>
<rect x="470" y="120" width="300" height="130" rx="18" fill="#fff" stroke="#d8d1c4" stroke-width="3"/>
<text x="620" y="175" font-size="30" font-weight="700" text-anchor="middle">World model</text>
<text x="620" y="215" font-size="22" fill="#5d6775" text-anchor="middle">SQLite; unknown is not empty</text>
<rect x="870" y="120" width="300" height="130" rx="18" fill="#eef4f8" stroke="#2578b5" stroke-width="3"/>
<text x="1020" y="175" font-size="30" font-weight="700" text-anchor="middle">MCP server</text>
<text x="1020" y="215" font-size="22" fill="#5d6775" text-anchor="middle">9 tools, read-only</text>
<rect x="470" y="420" width="700" height="170" rx="18" fill="#fff" stroke="#e37a0a" stroke-width="3"/>
<text x="820" y="480" font-size="32" font-weight="700" text-anchor="middle">Agent loop (custom, provider-agnostic)</text>
<text x="820" y="522" font-size="22" fill="#5d6775" text-anchor="middle">LLM, tool call, run tool, result back to LLM, with a round budget</text>
<text x="820" y="558" font-size="22" fill="#5d6775" text-anchor="middle">Router evaluated on 700+ questions across 3 runs; about 5% exact match; replaced</text>
<rect x="70" y="420" width="300" height="170" rx="18" fill="#fff" stroke="#d8d1c4" stroke-width="3"/>
<text x="220" y="490" font-size="30" font-weight="700" text-anchor="middle">Voice</text>
<text x="220" y="530" font-size="22" fill="#5d6775" text-anchor="middle">speech in, spoken answer out</text>
<rect x="1270" y="120" width="260" height="470" rx="18" fill="#fbf8f2" stroke="#d8d1c4" stroke-width="3" stroke-dasharray="10 8"/>
<text x="1400" y="175" font-size="26" font-weight="700" text-anchor="middle">Any provider</text>
<text x="1400" y="215" font-size="21" fill="#5d6775" text-anchor="middle">local Ollama</text>
<text x="1400" y="250" font-size="21" fill="#5d6775" text-anchor="middle">OpenAI-compatible</text>
<text x="1400" y="285" font-size="21" fill="#5d6775" text-anchor="middle">hosted APIs</text>
<text x="1400" y="340" font-size="21" fill="#5d6775" text-anchor="middle">only the adapter</text>
<text x="1400" y="372" font-size="21" fill="#5d6775" text-anchor="middle">changes</text>
<line x1="370" y1="185" x2="470" y2="185" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="770" y1="185" x2="870" y2="185" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="1020" y1="250" x2="1020" y2="420" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="960" y1="420" x2="960" y2="250" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="370" y1="505" x2="470" y2="505" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="470" y1="545" x2="370" y2="545" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<line x1="1170" y1="505" x2="1270" y2="505" stroke="#5d6775" stroke-width="4" marker-end="url(#a)"/>
<text x="800" y="740" font-size="24" fill="#5d6775" text-anchor="middle">Deterministic code moves the data and runs the tools. The model decides which tool to call and how to phrase the answer.</text>
<text x="800" y="790" font-size="20" fill="#8a94a1" text-anchor="middle">Schematic, August 2026. Hundreds of tests. Repo private for now.</text>
</g></svg>